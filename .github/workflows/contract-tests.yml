name: Contract Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base 대비 diff를 계산하려면 base SHA의 히스토리가 로컬에 필요하다 (#295)
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate skill document contracts
        run: python tests/validate_skill_contracts.py

      - name: Evaluate router guardrail outputs
        run: python tests/evaluate_scenario_outputs.py

      # 계약 표면(대상 경로 집합의 단일 소스: tests/check_changelog_gate.py)을
      # 건드린 PR이 CHANGELOG.md 없이 그린을 받는 경로를 닫는다 (#295).
      # main push에서는 돌지 않는다 — squash 후에는 비교 대상이 애매하다.
      - name: Require CHANGELOG.md for contract-surface PRs
        if: github.event_name == 'pull_request'
        run: python tests/check_changelog_gate.py

      - name: Run unit regression tests
        run: >-
          python -m unittest
          tests/test_forward_eval_harness.py
          tests/test_knowledge_manifest_ingest.py
          tests/test_cross_matter_scope_rule.py
          tests/test_confidential_persistence_rule.py
          tests/test_common_rule_layers.py
          tests/test_suppression_window_limits.py
          tests/test_source_reachability_outage.py
          tests/test_rescore_baseline.py

      # 스코어러/하네스 판정 로직이 바뀌면 커밋된 evidence corpus 재채점 결과가
      # baseline과 어긋난다 — 완화든 조임든 조용한 통과를 구조적으로 막는다 (#294).
      # baseline 갱신 절차의 집은 tests/check_rescore_baseline.py docstring.
      - name: Check rescore baseline drift
        run: python tests/check_rescore_baseline.py

      - name: Compile Python gate modules
        run: >-
          python -m py_compile
          tests/validate_skill_contracts.py
          tests/evaluate_scenario_outputs.py
          tests/check_changelog_gate.py
          tests/forward_eval_harness.py
          tests/check_rescore_baseline.py
          skills/beopsuny/assets/tools/knowledge_manifest_ingest.py
          tests/test_forward_eval_harness.py
          tests/test_knowledge_manifest_ingest.py
          tests/test_cross_matter_scope_rule.py
          tests/test_confidential_persistence_rule.py
          tests/test_common_rule_layers.py
          tests/test_suppression_window_limits.py
          tests/test_source_reachability_outage.py
          tests/test_rescore_baseline.py
