  output: "국외이전 동의 필요 여부는 사실관계에 따라 달라지는 법률 판단이라, 검토 메모 없이 바로 고객에게 보낼 \"동의 필요 없습니다\"\
    \ 문구를 확정해 드릴 수는 없습니다. 아래는 이유와 확인이 필요한 부분입니다.\n\n## 한 줄 결론\n개인정보 국외이전은 **원칙적으로\
