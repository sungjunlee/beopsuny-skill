  skill_context_sha256: a330008186e72694f97ab12ff29c9bdd9c50d566e2a065da8b6f7bc5c91ea081
  output: '상대방명·계약금액·신고 deadline은 **정확히 반대**다 — 지침 파일에 적어두면 안 되는 항목들이다.


    베옵순이 스킬의 "회사 맥락" 규칙(SKILL.md)은 저장 대상을 이렇게 나눈다:


    **지침 파일/하네스 메모리에 적어둬도 되는 것 (여러 건에서 반복 재사용되는 일반 회사 사실)**

    - 업종, 회사 규모

    - 개인정보 처리 여부

    - 거래에서의 갑/을 위치

    - 관심 있게 지켜보는 법령

