    \n## 확인 필요 정보\n아래 중 어느 것에 해당하는지에 따라 결론이 달라집니다.\n\n1. **정보주체 동의**(1호) — 이미 별도 동의를\
    \ 받았는지\n2. **조약/국제협정 근거**(2호) — 해당 없는 경우가 대부분\n3. **계약 체결·이행에 필요한 처리위탁·보관**(3호)\
    \ — 이 거래가 정보주체(고객사의 최종 이용자)와의 계약 이행에 필요한 국외 위탁/보관이고, 이 사실을 ⓐ개인정보 처리방침에 공개했거나 ⓑ이메일\
    \ 등으로 사전 고지했는지\n4. **보호위원회 인증**(4호) — 이전받는 자(해외 서버/벤더)가 개인정보 보호 인증을 받았는지\n5. **적정성\
