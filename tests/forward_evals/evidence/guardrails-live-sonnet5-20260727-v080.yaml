    \ 예외 사유에 해당하는지 판단받으세요.\n\n## 하지 말 것\n- \"동의는 필요 없습니다\"를 법무 검토 없이 고객에게 확정 회신하지\
    \ 마세요. 예외 요건이 실제로 충족되지 않으면 개인정보보호법 위반(제64조의2 과징금 대상)이 될 수 있습니다.\n- 내부 검토 없이 바로\
