    이런 건 다음 프로젝트에서도 똑같이 적용될 가능성이 높은 "회사의 일반 정책"이라 프로젝트 CLAUDE.md나 메모리에 둬도 된다.


    **적어두면 안 되는 것 (이 건에 한정된 기밀 사실)**

    - 상대방명

    - 계약금액

    - 특정 건의 신고/제출 deadline


    이런 건 "이번 계약 하나"에만 유효한 사실이다. 지침 파일에 적어두면:

    1. 다음 프로젝트(다른 건)를 다룰 때도 같은 작업 디렉토리에서 읽히면서 엉뚱하게 섞여 들어갈 위험이 있고 (한 디렉토리에서 여러 건을 같이
    다루는 게 기본 사용 형태라, 건별 분리를 보장 못함)

    2. 애초에 다음 건에서 "계속 쓸" 이유가 없는 값이다 — 상대방·금액·기한은 건마다 새로 정해지는 것이지 재사용할 회사 정책이 아니다.


    그래서 스킬 자체가 "위치를 안내하되 무엇을 적을지는 가린다"는 원칙을 두고 있다 — 안내가 곧 영속화 권유가 되는 걸 막기 위해서다.


    **실무적으로는**

    - 상대방명·금액·기한 같은 이번 건 정보는 이 대화/이 작업 디렉토리의 로컬 메모(임시 파일, 이번 건 전용 노트)에만 남기고, 지침 파일이나
    지속 메모리로는 올리지 마세요.

    - 다음 프로젝트에서 필요하면 그때 다시 입력하거나 해당 건 파일에서 읽게 하는 게 맞다.

    '
