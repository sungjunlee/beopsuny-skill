    ---


    ### 1. 왜 뉴스레터를 단독 근거로 쓸 수 없는지


    로펌 뉴스레터는 출처 권위상 `해설/의견`이며 법률 결론의 단독 근거로 쓰지 않습니다. 특히 이 사안에서는 단순 원칙 문제가 아니라 실제 리스크가
    있습니다 — 공정거래법이 **2024.2.6 개정, 2024.8.6 시행**으로 "소규모피취득회사 신고 제도"(거래금액 기준 신고)를 신설했습니다.
    뉴스레터가 이 개정 전에 작성됐다면 회사 규모 기준만 다루고 거래금액 기준 자체가 빠져 있을 수 있고, 개정 후 작성됐더라도 실제 반영 여부는
    원문 대조 없이는 알 수 없습니다. 2024년이라는 한 해 안에서도 시행 전/후로 기준이 갈리는 시점이라 `[STALE]` 위험이 특히 높습니다.


    ### 2. 현재 시행 중인 신고 기준 (원문 확인)


    **[공식 원문 기반 로컬 미러] [VERIFIED]** — legalize-kr 로컬 미러 확인 (직접 공식 사이트 확인 아님)


    | 유형 | 기준 | 근거 |

    |---|---|---|

    | 일반 신고기준 | 기업결합신고대상회사(자산총액 또는 매출액 **3천억원 이상**) + 상대회사(자산총액 또는 매출액 **300억원 이상**)
    | 법 제11조제1항, 시행령 제18조제1항·제2항 |

    | 외국회사 특칙 | 위 요건 충족 + 외국회사의 국내매출액 **300억원 이상** | 시행령 제18조제3항 |

    | 소규모피취득회사 신고기준 (2024.8.6 시행) | 상대회사가 자산·매출 기준 미달이어도, 거래대가 총액 **6천억원 이상** + 국내
    시장에서 상당한 수준의 활동(월 100만 명 이상 대상 판매·제공 등) | 법 제11조제2항, 시행령 제19조 |


    ### 3. "신고 불필요" 결론에 필요한 것


    위 기준을 이 거래에 적용하려면 최소한 다음이 필요합니다.


    - 기업결합신고대상회사·상대회사 각각의 **자산총액/매출액** (계열회사 합산 기준)

    - 거래대가 총액 (소규모피취득회사 경로 배제 여부 확인용)

    - 상대회사가 벤처투자조합·신기술사업자 등 법 제11조제3항의 **신고 제외 사유**에 해당하는지

    - 상대회사가 외국회사인 경우 국내매출액


    이 정보를 주시면 실제 신고 의무 여부를 원문 기준으로 판단해 드리겠습니다. 정보 없이 뉴스레터 인용만으로 "신고 불필요"라고 확정하는 것은
    권해드리지 않습니다.


