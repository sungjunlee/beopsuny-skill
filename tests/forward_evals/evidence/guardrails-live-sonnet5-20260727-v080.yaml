    > 사업자, 이행 보조자 또는 피고용자의 **고의 또는 중대한 과실**로 인한 법률상의 책임을 배제하는 조항 → **무효**

    > 상당한 이유 없이 사업자의 손해배상 범위를 제한하거나 위험을 고객에게 떠넘기는 조항 → **무효**


    **[공식 원문 기반 로컬 미러] [VERIFIED]** — 같은 법 제8조(손해배상액의 예정): 고객에게 부당하게 과중한 손해배상 의무를
    부담시키는 조항도 무효입니다. (SaaS 책임제한은 주로 공급자→고객 방향 제한이라 제8조보다 제7조가 핵심 쟁점입니다.)


    즉 SaaS 책임제한(limitation of liability) 조항은 실무에서 흔히 쓰이지만, **고의·중과실까지 면책 범위에 포함**시키거나
