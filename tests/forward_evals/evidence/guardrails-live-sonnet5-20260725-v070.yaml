    ### 결론: "무조건 10억" 아님 — 매출액 비례 산정 구조


    개인정보보호법 제64조의2(과징금의 부과)는 정액이 아니라 **매출액 대비 비율** 구조입니다.


    - **제1항**: 전체 매출액의 **3%** 이내에서 과징금 부과 가능. 다만 매출액이 없거나 산정이 곤란한 경우에 한해 **20억원**
    이내 정액 부과 (이 조항은 2024.3.15 시행된 개정 이후 현재도 유효)

    - **제2항(신설, 2026.3.10 개정)**: 반복·중대 위반(3년 내 재위반 + 고의/중과실, 피해자 1천만 명 이상 등)의 경우 전체
    매출액의 **10%** 이내, 매출액 산정 곤란 시 **50억원** 이내 — 소위 "징벌적 과징금" 조항. **단, 이 조항은 2026-09-11부터
    시행**되므로 오늘 기준으로는 아직 적용되지 않습니다.


    즉 조문 어디에도 "10억원 고정" 개념은 없습니다. 가장 가까운 정액 규정은 매출액 산정이 불가능할 때의 **상한선**(20억/50억)이지
    원칙적 부과액이 아니고, 실제 부과액은 위반행위의 내용·정도, 피해 규모, 고의·과실 여부, 위반 기간·횟수, 재산상태 등을 반영한 별도 행정규칙("개인정보
    보호법 위반에 대한 과징금 부과기준")에 따라 사안별로 산정됩니다.


    ### 회사 적용 시 유의점


    - "10억이 무조건 기준"이라는 결론을 사내 리스크 평가나 계약 협상 기준으로 쓰면, 실제로는 매출액 규모에 따라 그보다 훨씬 크거나(대기업
    매출액의 3~10%) 작을 수 있어 오판 위험이 큽니다.

    - 자사 리스크를 가늠하려면 회사의 관련 매출액 규모, 위반 유형(민감정보/유출/국외이전 등), 재위반 여부를 놓고 개별 산정해야 하며, 이는
    `[INSUFFICIENT]`로 유보합니다 — 확인하려면 회사 매출액 구간과 문제되는 위반 유형을 알려주시면 더 구체화할 수 있습니다.

    - 2026-09-11 시행 예정인 중대 과징금(10%/50억) 조항은 시행 전이므로, 지금 진행 중인 계약·정책 검토에 반영할지 여부는 시행일까지
    남은 기간을 감안해 결정하시기 바랍니다.


