- prompt_id: fwd-11-shape-deviating-verification
  guardrail_category: procedure_shape_freedom
  source_router_scenario: router-16
  prompt: '하도급법상 지연이자 요율이 최근에 바뀌었는지 확인해줘. 결론 표부터 보여주고

    순서는 편한 대로 정리해도 돼.'
  skill_context_sha256: d63b8f6bac485f8bf80f35bd02c3ce5d0b22f3501d0eb7d2faa80a6ec4b1f7f2
  output: '## 검토자 메모

    - 확인 범위: 법률 원문(로컬 미러) 직접 확인 + law.go.kr·공정거래위원회 사이트 실시간 접근 시도(일부 페이지는 JS 렌더링으로
    자동 조회 실패) + 뉴스/정책자료 교차 확인

    - 한계: 고시 원문 전체를 직접 열람하지 못해 "현재 15.5%, 최근 변경 없음"은 2차 자료 교차확인 수준. 소송·기관 제출용이면 law.go.kr에서
    고시 원문을 직접 열람해 재확인 권장


    ## 결론 표


    | 항목 | 내용 | 근거 | 상태 |

    |---|---|---|---|

    | 최근 변경 여부 | **변경 없음** — 최소 2018년 이후 요율 개정 확인 안 됨 | 공정거래위원회 고시「선급금 등 지연지급시의 지연이율
    고시」(2018-21호, 2018.12.6.) | `[UNVERIFIED]` (고시 원문 미확인, 2차 자료 교차확인) |

    | 현재 요율 | **연 15.5%** | 위 고시 | `[UNVERIFIED]` (동일) |

    | 요율의 법적 상한·근거 구조 | 하도급법 제13조⑧: 원사업자가 60일 초과 지급 시, **연 40% 이내**에서 은행 연체금리 등을 고려해
    공정거래위원회가 고시하는 이율 적용 | 하도급거래 공정화에 관한 법률 제13조⑧ | `[VERIFIED]` — legalize-kr 로컬 미러
    원문 확인 |

    | 마지막 실제 요율 조정 시점 | 2015.7.1. 시행 — 연 20% → 연 15.5%로 인하 (이후 15.5% 유지) | 공정거래위원회
    조정 발표 / KDI 경제정보센터 정책자료 | `[UNVERIFIED]` — 정부 관련 기관 자료이나 원문 고시 대조는 못함 |


    ## 상세


    **법적 근거 구조 (VERIFIED)**


    하도급거래 공정화에 관한 법률 제13조⑧은 요율 자체를 법률에 못박지 않고, "연 100분의 40 이내에서 「은행법」에 따른 은행이 적용하는
    연체금리 등 경제사정을 고려하여 공정거래위원회가 정하여 고시하는 이율"로 위임한다. 즉 실제 숫자(%)는 법률·시행령이 아니라 공정거래위원회
    고시(행정규칙)에 있다. 이 부분은 legalize-kr 로컬 미러(하도급거래공정화에관한법률/법률.md)에서 직접 확인했다.


    **실제 요율 (UNVERIFIED — 교차확인)**


    - 공정거래위원회는 2015.7.1.자로 지연이율을 연 20%에서 **연 15.5%**로 인하했다 (당시 시중은행 연체금리 평균 15.17%
    반영).

    - 이후 고시가 「선급금 등 지연지급시의 지연이율 고시」(공정거래위원회고시 제2018-21호, 2018.12.6.)로 정비·재발령되었는데,
    이때도 요율은 **15.5%로 유지**된 것으로 확인된다 (변경이 아니라 고시 형식 정비로 보임).

    - 2024년 개정 표준하도급계약서도 지연이자 조항에서 여전히 15.5%를 현재 요율로 인용하고 있어, 적어도 2024년까지는 변경이 없었다는
    정황이 뒷받침된다.

    - 다만 나(법순이)는 law.go.kr·공정거래위원회 사이트에서 고시 원문 페이지 자체를 직접 렌더링해 확인하지 못했다 (검색 인터페이스가
    자동 조회에 결과를 반환하지 않음). 따라서 "최근 변경 없음"과 "15.5%"는 확정이 아니라 다수의 2차 자료(정부 산하 연구기관 정책자료,
    업계 표준계약서, 전문 칼럼)가 일치하는 수준의 신뢰도다.


    **참고 — 60일 이내 구간과의 구분**


    60일 이내 미지급은 이 고시가 아니라 별도 논의 대상(상사법정이율 등)이며, 하도급법상 15.5% 지연이자는 "목적물등 수령일부터 60일
    초과" 구간에만 적용된다(법 제13조⑧). 실무에서 자주 혼동되는 지점이라 결론 적용 시 유의가 필요하다.


    **확인 필요 시 직접 링크**

    - 법령 원문: https://www.law.go.kr/법령/하도급거래공정화에관한법률

    - 고시(행정규칙) 페이지: https://www.law.go.kr/행정규칙/선급금등지연지급시의지연이율고시


    ---

    🔍 자가 검증: Citation 4/4 (법률 원문 1건 VERIFIED, 고시 관련 3건 UNVERIFIED) | Legal Substance
    ✓ (요율 위임구조와 실제 수치를 분리해 결론 강도 차등 부여) | Client Alignment ✓ (변경 여부라는 단일 질문에 집중, 계약서·체크리스트
    확장 없음) | Counter-draft n/a


    ⚠️ **참고**: 이 정보는 일반적인 법률 정보 제공 목적이며, 구체적인 법률 문제는 변호사와 상담하시기 바랍니다.

    '
