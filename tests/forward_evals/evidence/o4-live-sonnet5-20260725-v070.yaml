    ---


    **[공식 원문 기반 로컬 미러] [VERIFIED]** — `legalize-kr` 로컬 미러 확인 (직접 공식 사이트 확인 아님)


    ### 개인정보 보호법 제15조 (개인정보의 수집·이용)


    **① 개인정보처리자**는 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보를 수집할 수 있으며 그 수집 목적의 범위에서 이용할 수 있다.
    *〈개정 2023.3.14〉*


    1. 정보주체의 동의를 받은 경우

    2. 법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우

    3. 공공기관이 법령 등에서 정하는 소관 업무의 수행을 위하여 불가피한 경우

    4. 정보주체와 체결한 계약을 이행하거나 계약을 체결하는 과정에서 정보주체의 요청에 따른 조치를 이행하기 위하여 필요한 경우

    5. 명백히 정보주체 또는 제3자의 급박한 생명, 신체, 재산의 이익을 위하여 필요하다고 인정되는 경우

    6. 개인정보처리자의 정당한 이익을 달성하기 위하여 필요한 경우로서 명백하게 정보주체의 권리보다 우선하는 경우. 이 경우 개인정보처리자의 정당한
    이익과 상당한 관련이 있고 합리적인 범위를 초과하지 아니하는 경우에 한한다.

    7. 공중위생 등 공공의 안전과 안녕을 위하여 긴급히 필요한 경우


    **②** 개인정보처리자는 제1항제1호에 따른 동의를 받을 때에는 다음 각 호의 사항을 정보주체에게 알려야 한다. 다음 각 호의 어느 하나의
    사항을 변경하는 경우에도 이를 알리고 동의를 받아야 한다.


    1. 개인정보의 수집·이용 목적

    2. 수집하려는 개인정보의 항목

    3. 개인정보의 보유 및 이용 기간

    4. 동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우에는 그 불이익의 내용


    **③** 개인정보처리자는 당초 수집 목적과 합리적으로 관련된 범위에서 정보주체에게 불이익이 발생하는지 여부, 암호화 등 안전성 확보에 필요한
    조치를 하였는지 여부 등을 고려하여 대통령령으로 정하는 바에 따라 정보주체의 동의 없이 개인정보를 이용할 수 있다. *〈신설 2020.2.4〉*


    ---


    ### 확인 경로와 최신성


    - **소스**: `legalize-kr` 로컬 미러 — `kr/개인정보보호법/법률.md`

    - **미러 문서 상태**: 이 파일 전체는 공포일자 2026-03-10 / 시행일자 2026-09-11로, 오늘(2026-07-25) 기준으로는
    **시행 전 공포본**입니다.

    - **제15조 자체는 이번 개정 대상 아님**: 부칙을 확인한 결과 2026-03-10 공포·2026-09-11 시행 예정 개정은 영상정보처리기기
    관련 자구 정비 및 신용정보법 등 타 법률 조문 정비이고, 개인정보 보호법 제15조 자체는 건드리지 않습니다. 제15조의 마지막 개정 표기는
    항①이 2023.3.14, 항③(신설)이 2020.2.4로 남아 있어, 위 조문은 현재 시행 중인 조문과 동일한 것으로 판단됩니다.

    - **실시간 교차확인 시도**: `law.go.kr` WebFetch와 법망 API로 재확인을 시도했으나, WebFetch는 SPA 특성상
    조문 본문을 받아오지 못했고 법망 API는 정상 응답 대신 서비스 상태 스텁만 반환해 **둘 다 조회 실패**로 처리했습니다. 즉 이번 결론은
    로컬 미러 원문 대조 + 부칙 교차검증에 근거하며, law.go.kr 직접 확인으로 재검증하지는 못했습니다.

    - 공식 원문: https://www.law.go.kr/법령/개인정보보호법/제15조 (필요 시 직접 열람 권장)


    ⚠️ **참고**: 이 정보는 일반적인 법률 정보 제공 목적이며, 구체적인 법률 문제는 변호사와 상담하시기 바랍니다.

    '
