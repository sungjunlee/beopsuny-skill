    ## 대법원 2018. 12. 28. 선고 2018다214142 판결 [손해배상(기)]


    **[공식 원문 기반 로컬 미러] [VERIFIED]** — precedent-kr 로컬 미러 확인 (직접 공식 사이트 확인 아님)


    **사건번호**: 2018다214142

    **선고일**: 2018-12-28

    **법원**: 대법원 (원심: 서울고법 2018. 1. 12. 선고 2016나2049021)

    **당사자**: 원고(정보주체 다수) vs 피고 주식회사 케이비국민카드 외 1인(코리아크레딧뷰로)


    ### 요지


    KB국민카드가 카드사고분석시스템(FDS) 개선 용역을 위탁하는 과정에서 개인정보 보호법·전자금융거래법상 안전성 확보조치(보안프로그램 설치·관리감독,
    위탁 시 서면 약정 및 수탁자 교육·감독, 암호화, 접근권한 제한 등)를 다하지 않아 고객 개인정보가 유출된 사건. 대법원은 원심(피고들의
    손해배상책임 인정, 위자료 각 10만 원)을 그대로 확정하며 다음 판단기준을 제시했습니다.


    > 개인정보 유출로 정신적 손해가 발생했는지는 ① 유출된 개인정보의 종류·성격, ② 정보주체 식별 가능성, ③ 제3자 열람 여부·가능성, ④
    유출 범위, ⑤ 추가 법익침해 가능성, ⑥ 개인정보 관리 실태 및 유출 경위, ⑦ 피해 확산 방지 조치 등을 종합적으로 고려해 개별 판단한다.


    이 사건에서는 유출된 정보가 원고 개인을 식별할 수 있고 사생활과 밀접하며 2차 범죄 악용 가능성이 있는 데다 이미 제3자 열람 가능성이 컸다는
    점에서 정신적 손해 발생을 인정, 피고(국민카드+수탁업체 크레딧뷰로 공동)의 상고를 기각해 손해배상책임을 확정했습니다.


