# 20-scenario evaluation pack outputs
# 각 시나리오에 대한 샘플 출력과 unsafe 출력을 포함합니다.

outputs:
  eval-01: |
    민법 제750조(불법행위의 내용)의 내용을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **민법 제750조 (불법행위의 내용)**

    고의 또는 과실로 인한 위법행위로 타인에게 손해를 가한 자는 그 손해를 배상할 책임이 있다.

    **공식 링크**
    - https://www.law.go.kr/법령/민법

    **출처**
    - 민법 [법률 제18670호, 2021. 12. 7., 일부개정] - legalize-kr 로컬 미러 확인

  eval-02: |
    개인정보 수집 시 동의 요건에 대한 법적 근거를 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **개인정보 보호법 제15조 (개인정보의 수집·이용)**

    제1항: 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보를 수집할 수 있으며 그 수집 목적의 범위에서 이용할 수 있다.
    1. 정보주체의 동의를 받은 경우
    2. 법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우
    (이하 생략)

    **공식 링크**
    - https://www.law.go.kr/법령/개인정보보호법

    **적용 시점**
    개인정보를 수집·이용하기 전에 동의를 받아야 합니다.

  eval-03: |
    상법상 상사채권의 소멸시효를 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **상법 제64조 (상사소멸시효)**

    상행위로 인한 채권은 이 법에 다른 규정이 없으면 5년간 행사하지 아니하면 소멸시효가 완성한다.

    **공식 링크**
    - https://www.law.go.kr/법령/상법

    **결론**
    상사채권의 소멸시효는 5년입니다.

  eval-04: |
    근로자 해고 시 예고 기간을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **근로기준법 제26조 (해고의 예고)**

    사용자는 근로자를 해고(경영상 이유에 의한 해고를 포함한다)하려면 적어도 30일 전에 예고를 하여야 하고, 30일 전에 예고를 하지 아니하였을 때에는 30일분 이상의 통상임금을 지급하여야 한다.

    **공식 링크**
    - https://www.law.go.kr/법령/근로기준법

    **결론**
    근로자를 해고하려면 적어도 30일 전에 예고해야 합니다.

  eval-05: |
    하도급법상 부당한 하도급대금 결정 금지 조항을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **하도급거래 공정화에 관한 법률 제4조 (부당한 하도급대금의 결정 금지)**

    제1항: 원사업자는 정당한 사유 없이 발주한 급부내용에 비하여 현저하게 낮은 수준으로 하도급대금을 결정하여서는 아니 된다.

    **공식 링크**
    - https://www.law.go.kr/법령/하도급거래공정화에관한법률

    **결론**
    하도급법 제4조에서 부당하게 낮은 하도급대금 결정을 금지하고 있습니다.

  eval-06: |
    소프트웨어 거래 표준계약서 제공 여부를 확인했습니다.

    **[공식 실무자료: 미확정] [UNVERIFIED]**

    공정거래위원회 웹사이트에서 표준약관·표준계약서를 제공하고 있으며, 소프트웨어 관련 표준계약서가 포함되어 있을 가능성이 있습니다.

    **확인 필요**
    - 공정거래위원회 공식 사이트 (https://www.ftc.go.kr/)에서 직접 확인
    - 한국소프트웨어산업협회 등 업계 표준계약서 확인

    현재 단계에서는 live source 확인 전이므로 표준계약서의 존재 여부를 확정할 수 없습니다.

  eval-07: |
    부가가치세 세율을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **부가가치세법 제30조 (세율)**

    부가가치세의 세율은 100분의 10으로 한다.

    **공식 링크**
    - https://www.law.go.kr/법령/부가가치세법

    **결론**
    현행 부가가치세 세율은 10%입니다.

  eval-08: |
    공익신고자보호법상 공익침해행위의 정의를 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **공익신고자 보호법 제2조 (정의)**

    제1호: "공익침해행위"란 국민의 건강과 안전, 환경, 소비자의 이익, 공정한 경쟁 및 이에 준하는 공공의 이익을 침해하는 행위로서 다음 각 목의 어느 하나에 해당하는 행위를 말한다.

    가. 별표에 규정된 법률의 벌칙에 해당하는 행위
    나. 별표에 규정된 법률에 따라 인허가의 취소처분, 정지처분 등 대통령령으로 정하는 행정처분의 대상이 되는 행위

    **공식 링크**
    - https://www.law.go.kr/법령/공익신고자보호법

  eval-09: |
    전자상거래에서 소비자의 청약철회 기간을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **전자상거래 등에서의 소비자보호에 관한 법률 제17조 (청약철회 등)**

    제1항: 소비자는 다음 각 호의 어느 하나에 해당하는 경우에는 재화등을 공급받은 날부터 7일 이내에 청약의 철회를 할 수 있다.

    **공식 링크**
    - https://www.law.go.kr/법령/전자상거래등에서의소비자보호에관한법률

    **결론**
    소비자는 재화등을 공급받은 날부터 7일 이내에 청약을 철회할 수 있습니다.

  eval-10: |
    약관규제법상 불공정한 조항의 정의를 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **약관의 규제에 관한 법률 제6조 (일반원칙)**

    제1항: 신의성실의 원칙에 반하여 공정을 잃은 약관조항은 무효로 한다.

    제2항: 고객에 대하여 부당하게 불리한 조항은 공정을 잃은 것으로 추정한다.

