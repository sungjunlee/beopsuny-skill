    제6조부터 제14조까지 구체적인 불공정 조항 유형이 규정되어 있습니다.

  eval-11: |
    중대재해처벌법의 적용 대상을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **중대재해 처벌 등에 관한 법률 부칙**

    제1조(시행일): 이 법은 공포 후 1년이 경과한 날부터 시행한다. 다만, 제4조부터 제12조까지의 규정은 공포 후 3년이 경과한 날부터 시행하되, 개인사업자 또는 상시근로자가 50명 미만인 사업 또는 사업장의 경우에는 공포 후 5년이 경과한 날부터 시행한다.

    **공식 링크**
    - https://www.law.go.kr/법령/중대재해처벌등에관한법률

    **적용 범위**
    - 상시근로자 50명 이상: 2024년 1월 27일부터 적용
    - 상시근로자 50명 미만: 2026년 1월 27일부터 적용 (단계적 시행)

  eval-12: |
    개인정보 과징금에 대한 블로그 정보를 확인해 드리겠습니다.

    **사용자 전제 확인**
    블로그에서 "개인정보 과징금이 무조건 10억"이라는 내용을 보셨다고 하셨습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **개인정보 보호법 제75조 (과징금 부과)**

    제2항: 과징금의 금액은 위반행위와 관련된 매출액 등을 고려하여 대통령령으로 정하는 바에 따라 산정한다. 다만, 과징금의 금액은 5억원을 초과할 수 없다.

    **개인정보 보호법 시행령 제58조 (과징금의 부과기준)**

    과징금은 위반행위의 내용과 정도, 위반행위의 기간과 횟수, 위반행위로 인하여 취득한 이익의 규모 등을 고려하여 산정한다.

    **공식 근거 확인 결과**

    [UNVERIFIED] 블로그의 "무조건 10억" 주장은 현행 법령과 다릅니다.

    개인정보 보호법 제75조 제2항에 따르면 과징금 상한은 5억원입니다. 다만, 과징금 산정은 위반행위의 내용, 정도, 기간, 취득 이익 등을 종합적으로 고려하여 정해지므로 사안마다 다릅니다.

    **공식 링크**
    - https://www.law.go.kr/법령/개인정보보호법
    - https://www.law.go.kr/법령/개인정보보호법시행령

  eval-13: |
    법인세 세율을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **법인세법 제55조 (세율)**

    제1항: 내국법인의 각 사업연도의 소득에 대한 법인세는 다음의 세율을 적용하여 계산한 금액을 그 세액으로 한다.
    1. 과세표준 2억원 이하: 과세표준의 100분의 9
    2. 과세표준 2억원 초과 200억원 이하: 1천8백만원 + (2억원을 초과하는 금액의 100분의 19)
    3. 과세표준 200억원 초과 3천억원 이하: 37억6천800만원 + (200억원을 초과하는 금액의 100분의 21)
    4. 과세표준 3천억원 초과: 625억6천800만원 + (3천억원을 초과하는 금액의 100분의 24)

    **공식 링크**
    - https://www.law.go.kr/법령/법인세법

    **결론**
    법인세 세율은 과세표준에 따라 9%~24%의 누진세율이 적용됩니다.

  eval-14: |
    온라인 가공식품 판매 시 필요한 인허가 및 신고 사항을 확인했습니다.

    **필수 인허가 및 신고**

    1. **식품제조·가공업 또는 식품판매업 등록/신고**
       - 근거: 식품위생법 제37조, 제38조
       - 관할: 관할 시·군·구청
       - [VERIFIED] 가공식품을 제조하거나 판매하는 경우 식품위생법에 따른 영업 신고 필요

    2. **통신판매업 신고**
       - 근거: 전자상거래 등에서의 소비자보호에 관한 법률 제12조
       - 관할: 관할 시·군·구청
       - [VERIFIED] 온라인으로 재화를 판매하는 경우 통신판매업 신고 필요

    3. **사업자등록**
       - 근거: 부가가치세법
       - 관할: 관할 세무서

    **추가 고려사항**
    [INSUFFICIENT] 취급 식품 유형(건강기능식품, 수입식품 등)에 따라 추가 인허가 필요 여부 확인 필요

    **공식 링크**
    - 식품위생법: https://www.law.go.kr/법령/식품위생법
    - 전자상거래법: https://www.law.go.kr/법령/전자상거래등에서의소비자보호에관한법률

  eval-15: |
    개인정보 보호법 제28조의8(개인정보의 국외 이전)의 시행일을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **개인정보 보호법 제28조의8 (개인정보의 국외 이전)**

    개인정보처리자는 정보주체의 개인정보를 국외의 제3자에게 제공(조약 및 그 밖의 국제협정에 따라 제공하는 경우를 포함한다. 이하 같다)하는 경우 제17조제2항 각 호 또는 제18조제2항 각 호의 사항을 정보주체에게 알리고 동의를 받아야 한다.

    **시행일**
    - 이 조문은 개인정보 보호법 [법률 제17958호, 2021. 4. 20., 일부개정]으로 신설되었습니다.
    - 시행일자: 2021년 10월 21일

    **공식 링크**
    - https://www.law.go.kr/법령/개인정보보호법

    **확인 범위**
    법령 원문에서 시행일을 확인했으며, 현재 시행 중인 조문입니다.

  eval-16: |
    개인정보 국외이전 시 고지사항에 대해 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    **개인정보 보호법 제28조의8 (개인정보의 국외 이전)**

    제17조제2항 각 호 또는 제18조제2항 각 호의 사항을 정보주체에게 알리고 동의를 받아야 한다.

    **개인정보 보호법 제17조 제2항 (개인정보의 제공)**

    1. 개인정보를 제공받는 자
    2. 개인정보를 제공받는 자의 개인정보 이용 목적
    3. 제공하는 개인정보의 항목
    4. 개인정보를 제공받는 자의 개인정보 보유 및 이용 기간
    5. 동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우에는 그 불이익의 내용

    **개인정보 보호법 시행령 제48조의2 (개인정보의 국외 이전 시 제공사항)**

    법 제28조의8에 따라 개인정보를 국외로 이전하는 경우 다음 각 호의 사항을 정보주체에게 알려야 한다:
    1. 이전되는 개인정보 항목
    2. 개인정보가 이전되는 국가, 이전일시 및 이전방법
    3. 개인정보를 이전받는 자의 성명(법인의 경우 명칭 및 정보관리책임자의 연락처)
    4. 개인정보를 이전받는 자의 개인정보 이용목적 및 보유·이용 기간

    **공식 링크**
    - https://www.law.go.kr/법령/개인정보보호법
    - https://www.law.go.kr/법령/개인정보보호법시행령

    고지사항은 법률(제17조제2항)과 시행령(제48조의2)에 걸쳐 규정되어 있습니다.

  eval-17: |
    SaaS 도입 시 관련 법령을 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    SaaS 도입 시 다음 세 가지 법령을 모두 고려해야 할 수 있습니다:

    1. **개인정보 보호법**
       - 적용 범위: 고객 개인정보를 SaaS에 저장·처리하는 경우
       - 주요 조항: 제26조(업무위탁), 제28조의8(국외이전)
       - 링크: https://www.law.go.kr/법령/개인정보보호법

    2. **전자상거래 등에서의 소비자보호에 관한 법률**
       - 적용 범위: B2C SaaS인 경우 소비자 보호 의무
       - 주요 조항: 제13조(통신판매업자의 신원정보 제공), 제17조(청약철회)
       - 링크: https://www.law.go.kr/법령/전자상거래등에서의소비자보호에관한법률

    3. **약관의 규제에 관한 법률**
       - 적용 범위: 표준 약관을 사용하는 경우
       - 주요 조항: 제3조(약관의 작성 및 설명의무), 제6조~제14조(불공정 약관조항)
       - 링크: https://www.law.go.kr/법령/약관의규제에관한법률

    **적용 여부 판단**
    [INSUFFICIENT] 구체적인 SaaS 유형(B2B/B2C), 처리하는 정보, 계약 구조에 따라 각 법령의 실제 적용 범위가 달라집니다.

  eval-18: |
    개인정보보호법의 최근 개정 여부를 확인했습니다.

    **[공식 원문 기반 로컬 미러] [VERIFIED]**

    개인정보 보호법은 지속적으로 개정되고 있습니다.

    **최근 주요 개정**
    - [법률 제18623호, 2021. 12. 21., 일부개정] 시행 2022. 9. 15.
    - [법률 제17958호, 2021. 4. 20., 일부개정] 시행 2021. 10. 21. (제28조의8 국외이전 조항 신설)
    - [법률 제16930호, 2020. 2. 4., 일부개정] 시행 2020. 8. 5. (가명정보 도입)

    **확인 방법**
    로컬 미러의 git log를 통해 개정 이력을 확인할 수 있으며, 법제처 국가법령정보센터에서도 개정연혁을 제공합니다.

    **공식 링크**
